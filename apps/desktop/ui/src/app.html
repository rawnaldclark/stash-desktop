<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<title>Stash</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/space-grotesk-var.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Appearance (src/lib/ui/theme.ts): the choice kept in this window is on <html> before the first paint. -->
		<script>try { var d = document.documentElement, t = localStorage.getItem('stash.theme'); if (localStorage.getItem('stash.black') === '1') d.dataset.black = '1'; if (t === 'dark' || t === 'light') d.dataset.theme = t; } catch (e) {}</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
