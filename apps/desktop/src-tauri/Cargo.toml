[package]
name = "stash-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
stash-core = { version = "0.0.1", path = "../../../crates/stash-core" }
stashd = { path = "../../../crates/stashd" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2.5.5"
souvlaki = "0.9.3"
serde_json = "1"
ureq = { version = "3.5.2", features = ["json"] }
tauri-plugin-global-shortcut = "2"

[build-dependencies]
tauri-build = "2.7.4"

[features]
# Serve the built UI from inside the program (no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
