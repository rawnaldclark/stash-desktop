[package]
name = "stashd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7"
getrandom = "0.3.4"
md-5 = "0.11"
rfd = "0.18.0"
trash = "5"
sha2 = "0.10.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stash-core = { version = "0.1.0", path = "../stash-core" }
stash-mornye = { version = "0.1.0", path = "../stash-mornye" }
tiny_http = "0.12.0"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
ureq = "3.5.2"
url = "2.5.8"
webpki-roots = "1.0.12"

[dev-dependencies]
ureq = { version = "3.5.2", features = ["json"] }
lofty = "0.25.5"
# Signs the stand-in config and checks Stash's signature in tests/tidal.rs (already in the build through rustls).
ring = "0.17.14"
zip = { version = "9.6.0", default-features = false }
