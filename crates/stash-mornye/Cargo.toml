[package]
name = "stash-mornye"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs Mornye (SpotiFLAC-format) extensions for Stash: a QuickJS runtime per add-on and the host it asks."

[dependencies]
# Mornye add-ons run in QuickJS, as in Lokal and Mornye itself.
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.8"
ureq = "3.5.2"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
base64 = "0.22.1"
getrandom = "0.3"
# Reads what an add-on wrote: codec, rate, depth, length.
lofty = "0.25.5"
# The clock as the computer reads it (`gobackend.getLocalTime`).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
iana-time-zone = "0.1.65"
# Ciphers and digests add-ons ask the host for (the versions Lokal's own port uses).
aes = "0.9"
aes-gcm = "0.11"
blowfish = "0.10"
cipher = "0.5"
ctr = "0.10"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
hmac = "0.13"
