[package]
name = "stash-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libloading = "0.9.1"
lofty = "0.25.5"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
ureq = "3.5.2"
url = "2.5.8"
walkdir = "2.5.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com"] }

[dev-dependencies]
flate2 = "1.1.11"
