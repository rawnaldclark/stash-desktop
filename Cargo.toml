[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri","crates/stash-core", "crates/stashd"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rawnaldclark/stash-desktop"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
